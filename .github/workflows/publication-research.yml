name: Publication extension reproducibility
on:
  push:
    paths: ['research_v6/**', '.github/workflows/publication-research.yml']
  workflow_dispatch:
    inputs:
      full_run:
        description: Recompute all publication-extension figures and verify six tables
        type: boolean
        default: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research_v6/requirements-lock.txt
      - run: python research_v6/run.py --mode check
      - if: github.event_name == 'workflow_dispatch' && inputs.full_run
        run: |
          python -m pip install -r research_v6/requirements-lock.txt
          python research_v6/run.py --mode full --work-dir output/publication_reproduction
      - if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: publication-reproduction-receipt
          path: output/publication_reproduction/run_logs_v6/
