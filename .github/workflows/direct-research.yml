name: Direct WaterGAP research reproducibility
on:
  push:
    paths: ['research_v8/**', '.github/workflows/direct-research.yml']
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research_v8/requirements-lock.txt
      - run: python research_v8/run.py --mode check
      - if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install -r research_v8/requirements-lock.txt
          python research_v8/run.py --mode full --work-dir output/direct_reproduction --figures
      - if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: direct-research-receipt
          path: output/direct_reproduction/run_logs_v8/
